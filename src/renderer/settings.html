<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' file: data:"><title>Orbit Settings</title><link rel="stylesheet" href="settings.css"></head><body>
<main><header><button id="settings-back" type="button" hidden>← Settings</button><h1 id="settings-heading">Settings</h1></header><section id="general-tab"><label><div><strong>Pet size</strong><small id="scale-label">100%</small></div><input id="petScale" type="range" min="60" max="240" step="5"></label><label title="Speed when the pet runs to your cursor with Super + Ctrl + Alt + P."><div><strong>Movement speed</strong><small id="movement-speed-label">700 px/s</small></div><input id="movementSpeed" type="range" min="150" max="1800" step="50" aria-label="Movement speed"></label><label><strong>Animations</strong><input id="animations" type="checkbox"></label><label><strong>Always show controls</strong><input id="controls" type="checkbox"></label><label><strong>Hover delay</strong><select id="hoverDelay" aria-label="Hover delay"><option value="400">Short</option><option value="750">Medium</option><option value="1200">Long</option></select></label><label><strong>Recent tasks</strong><select id="completionMinutes" aria-label="Recent tasks"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option></select></label><label><strong>Default harness</strong><select id="harness" aria-label="Default harness"><option value="codex-cli">Codex CLI</option><option value="codex-desktop">Codex Desktop</option><option value="claude">Claude Code</option><option value="antigravity">AGY CLI</option></select></label><div class="general-actions"><button id="reset" type="button">Reset position</button><button id="customize" type="button">Customize</button></div></section><div id="customization-tab" hidden><div class="mode-row"><select id="petMode" aria-label="Pet style"><option value="custom">Custom</option><option value="sprite">Sprite sheet</option></select></div><div id="custom-tab"><section><div class="pet-preview"><svg viewBox="0 0 150 145" aria-hidden="true"><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="var(--pet-body-light,#e7faf5)"/><stop offset="1" stop-color="var(--pet-body,#90bbb7)"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#193941"/><stop offset="1" stop-color="#091e27"/></linearGradient></defs>
<ellipse class="shadow" cx="75" cy="133" rx="30" ry="5" fill="#061e28" opacity=".2"/>
<g id="robot"><path d="M74 34V21" stroke="#6bafab" stroke-width="5"/><circle class="antenna" cx="74" cy="17" r="7" fill="#f6bd6b" stroke="#133947" stroke-width="3"/>
<g class="arms"><path d="M32 76L20 91M118 76L130 91" fill="none" stroke="#a6cdc4" stroke-width="9" stroke-linecap="round"/><circle cx="19" cy="94" r="6" fill="#f6bd6b"/><circle cx="131" cy="94" r="6" fill="#f6bd6b"/></g>
<rect x="32" y="34" width="86" height="69" rx="26" fill="url(#metal)" stroke="#183f49" stroke-width="3"/><path d="M48 39Q76 30 104 41" stroke="#fff" opacity=".65" stroke-width="3" fill="none"/>
<rect x="42" y="46" width="66" height="44" rx="17" fill="url(#glass)"/>
<g class="eyes" fill="var(--pet-accent,#8ce8cf)"><rect x="56" y="58" width="9" height="13" rx="4"/><rect x="85" y="58" width="9" height="13" rx="4"/></g><path class="mouth" d="M67 77Q75 83 83 77" fill="none" stroke="var(--pet-accent,#8ce8cf)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M56 103L53 116Q75 130 97 116L94 103" fill="#e2ece0" stroke="#183f49" stroke-width="3"/><circle cx="75" cy="112" r="5" class="core" fill="#f6bd6b"/><path d="M55 122L49 128M95 122L101 128" stroke="#183f49" stroke-width="6" stroke-linecap="round"/></g>
<g id="busy-stars" fill="#f6bd6b"><path d="M123 24l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><circle cx="28" cy="35" r="3"/></g></svg><div><strong id="preview-name">Orbit</strong></div></div>
<label><div><strong>Name</strong></div><input id="petName" type="text" maxlength="30" placeholder="Orbit"></label>

<label><div><strong>Body color</strong></div><input id="bodyColor" type="text" maxlength="7" spellcheck="false"></label>
<label><div><strong>Accent color</strong></div><input id="accentColor" type="text" maxlength="7" spellcheck="false"></label>
<label><div><strong>Expression</strong></div><select id="face"><option value="friendly">Friendly</option><option value="focused">Focused</option><option value="sleepy">Sleepy</option></select></label></section>
</div><section id="animation-tab" hidden><div class="pet-library-row"><select id="sprite-pet" aria-label="Choose pet"></select><button id="add-pet" type="button">+ Add pet</button></div><label><strong>Name</strong><input id="sprite-pet-name" type="text" maxlength="60" aria-label="Pet name"></label><label><strong>Animation</strong><select id="animation-state" aria-label="Animation"><option value="idle">Idle</option><option value="walking">Walking</option><option value="working">Working</option><option value="waiting">Waiting</option><option value="done">Done</option><option value="error">Error</option><option value="unknown">Stale</option></select></label><label><strong>Sheet faces</strong><select id="sprite-facing" aria-label="Selected animation sprite direction"><option value="right">Right</option><option value="left">Left</option></select></label><div class="sprite-preview"><span id="sprite-placeholder">Upload a horizontal sprite sheet</span><canvas id="sprite-preview" width="300" height="258" hidden></canvas></div><div class="sprite-actions"><span id="sprite-name">No sheet selected</span><button id="pick-sprite" type="button">Upload</button></div><label><strong>Cut count</strong><input id="sprite-frames" type="number" min="1" max="256" aria-label="Cut count"></label><label><strong>Speed (FPS)</strong><input id="sprite-fps" type="number" min="1" max="60" step="1" aria-label="Animation speed in frames per second"></label><p id="sprite-error" role="status"></p></section></div><footer><span id="saved" role="status">Saved</span><button id="done" type="button">Done</button></footer></main><div id="dropdown" class="dropdown" hidden></div><script src="sprite-player.js"></script><script src="settings-renderer.js"></script></body></html>
