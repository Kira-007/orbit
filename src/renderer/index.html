<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' file: data:"><title>Orbit Agent Pet</title><link rel="stylesheet" href="style.css"></head><body>
<main id="shell">
<div id="pet" role="button" tabindex="0" aria-label="Drag Orbit, or press Enter to open agent activity">
<canvas id="pet-sprite" width="600" height="516" hidden></canvas><svg viewBox="0 0 150 145" aria-hidden="true"><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="var(--pet-body-light,#e7faf5)"/><stop offset="1" stop-color="var(--pet-body,#90bbb7)"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#193941"/><stop offset="1" stop-color="#091e27"/></linearGradient></defs>
<ellipse class="shadow" cx="75" cy="133" rx="30" ry="5" fill="#061e28" opacity=".2"/>
<g id="robot"><path d="M74 34V21" stroke="#6bafab" stroke-width="5"/><circle class="antenna" cx="74" cy="17" r="7" fill="#f6bd6b" stroke="#133947" stroke-width="3"/>
<g class="arms"><path d="M32 76L20 91M118 76L130 91" fill="none" stroke="#a6cdc4" stroke-width="9" stroke-linecap="round"/><circle cx="19" cy="94" r="6" fill="#f6bd6b"/><circle cx="131" cy="94" r="6" fill="#f6bd6b"/></g>
<rect x="32" y="34" width="86" height="69" rx="26" fill="url(#metal)" stroke="#183f49" stroke-width="3"/><path d="M48 39Q76 30 104 41" stroke="#fff" opacity=".65" stroke-width="3" fill="none"/>
<rect x="42" y="46" width="66" height="44" rx="17" fill="url(#glass)"/>
<g class="eyes" fill="var(--pet-accent,#8ce8cf)"><rect x="56" y="58" width="9" height="13" rx="4"/><rect x="85" y="58" width="9" height="13" rx="4"/></g><path class="mouth" d="M67 77Q75 83 83 77" fill="none" stroke="var(--pet-accent,#8ce8cf)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M56 103L53 116Q75 130 97 116L94 103" fill="#e2ece0" stroke="#183f49" stroke-width="3"/><circle cx="75" cy="112" r="5" class="core" fill="#f6bd6b"/><path d="M55 122L49 128M95 122L101 128" stroke="#183f49" stroke-width="6" stroke-linecap="round"/></g>
<g id="busy-stars" fill="#f6bd6b"><path d="M123 24l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><circle cx="28" cy="35" r="3"/></g></svg>
</div>

<div id="toolbar" aria-label="Pet controls"><span id="collapsed-usage-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden></span>
<button id="chat-toggle" title="Message a conversation" aria-label="Message a conversation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="m14 5 5 5M9 15l-1 4 4-1L21 9a3.5 3.5 0 0 0-5-5z"/></svg></button>
<button id="usage-toggle" title="Usage remaining" aria-label="Usage remaining" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19a10 10 0 1 1 16 0M12 12l5-5M5 12h1M12 3v1M18 12h1"/><circle cx="12" cy="12" r="2"/></svg></button>
<button id="notifications" title="Task notifications" aria-label="Task notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14l3 10v5H2v-5zM2 15h6l2 3h4l2-3h6"/></svg><span id="badge" hidden>0</span></button>
</div>
<section id="panel" hidden aria-label="Agent activity">
<form id="composer" hidden>
<textarea id="prompt" placeholder="Write a message…" aria-label="Message selected conversation" maxlength="12000" rows="3"></textarea>
<div class="compose-actions"><input id="harness" type="hidden" value="codex-cli"><button id="harness-toggle" type="button" aria-expanded="false">Codex CLI ▾</button><button id="thread-toggle" type="button" aria-expanded="false" aria-label="Choose thread">Choose thread ▾</button><button id="submit-task" type="submit" title="Send message (Enter; Shift+Enter for a new line)" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
<div id="harness-menu" hidden role="group" aria-label="Choose harness"><button type="button" data-harness="codex-cli">Codex CLI</button><button type="button" data-harness="codex-desktop">Codex Desktop</button><button type="button" data-harness="claude">Claude Code</button><button type="button" data-harness="antigravity">AGY CLI</button></div>
<div id="projects" hidden role="group" aria-label="Choose thread"></div>
</form>
<section id="settings-panel" hidden aria-label="Orbit settings">
<div class="settings-heading">Settings</div>
<label class="setting-row"><span>Animations</span><input id="setting-animations" type="checkbox"></label>
<label class="setting-row"><span>Always show controls</span><input id="setting-controls" type="checkbox"></label>
<label class="setting-row"><span>Hover delay</span><select id="setting-hover"><option value="400">Short</option><option value="750">Medium</option><option value="1200">Long</option></select></label>
<label class="setting-row"><span>Keep completed tasks</span><select id="setting-completions"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option></select></label>
<label class="setting-row"><span>Default harness</span><select id="setting-harness"><option value="codex-cli">Codex CLI</option><option value="codex-desktop">Codex Desktop</option><option value="claude">Claude Code</option><option value="antigravity">AGY CLI</option></select></label>
<div class="settings-actions"><button id="setting-position" type="button">Reset position</button><button id="settings-done" type="button">Done</button></div>
</section>
<div id="usage-panel" hidden aria-label="Usage remaining"></div><div id="cards"></div><div id="toast" role="status"></div>
</section>
<div id="overlay-layer"><div id="pet-menu" hidden><button id="pet-hide" type="button">Hide</button><button id="pet-settings" type="button">Settings</button></div><div id="settings-menu" hidden></div></div></main><script src="sprite-player.js"></script><script src="drag-direction.js"></script><script src="pet-state.js"></script><script src="notifications.js"></script><script src="renderer.js"></script></body></html>
